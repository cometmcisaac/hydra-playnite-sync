name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Read manifest version
        id: version
        shell: pwsh
        run: |
          $m = (Select-String -Path src/HydraSync/extension.yaml -Pattern '^Version:\s*(.+)$').Matches
          if ($m.Count -eq 0) { throw "Version not found in extension.yaml" }
          $v = $m[0].Groups[1].Value.Trim()
          "version=$v" >> $env:GITHUB_OUTPUT
          $tag = "${{ github.ref_name }}".TrimStart("v")
          if ($tag -ne $v) {
            throw "Tag v$tag does not match extension.yaml version $v — bump the manifest or fix the tag."
          }

      - name: Build
        run: dotnet build src/HydraSync/HydraSync.csproj -c Release -v q

      - name: Package .pext
        shell: pwsh
        run: |
          $out = "src/HydraSync/bin/Release"
          $files = @(
            "extension.yaml",
            "icon.png",
            "HydraSync.dll",
            "LevelDb.Managed.dll",
            "Snappier.dll",
            "Newtonsoft.Json.dll",
            "System.Buffers.dll",
            "System.Memory.dll",
            "System.Numerics.Vectors.dll",
            "System.Runtime.CompilerServices.Unsafe.dll"
          )
          foreach ($f in $files) {
            if (-not (Test-Path (Join-Path $out $f))) { throw "Missing build output: $f" }
          }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zipPath = Join-Path (Resolve-Path dist) "HydraSync.zip"
          if (Test-Path $zipPath) { Remove-Item $zipPath }
          $zip = [System.IO.Compression.ZipFile]::Open($zipPath, "Create")
          try {
            foreach ($f in $files) {
              [System.IO.Compression.ZipFileExtensions]::CreateEntryFromFile(
                $zip, (Join-Path (Resolve-Path $out) $f), $f,
                [System.IO.Compression.CompressionLevel]::Optimal) | Out-Null
            }
          } finally {
            $zip.Dispose()
          }
          $final = "dist/HydraSync-${{ steps.version.outputs.version }}.pext"
          Move-Item $zipPath $final -Force
          Get-ChildItem dist | Format-Table Name, Length

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.pext
          body_path: .github/release-body.md
          generate_release_notes: true

      - name: Record release in InstallerManifest on main
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          $file = "InstallerManifest.yaml"
          if (-not (Test-Path $file)) {
            "AddonId: A76358E9-BFA2-4189-B6F3-2307EA4E217B`nPackages:" | Set-Content $file -NoNewline
          }
          $text = Get-Content $file -Raw
          $escaped = [regex]::Escape($version)
          if ($text -match "(?m)^\s*-\s+Version:\s+$escaped\s*$") {
            Write-Host "InstallerManifest already records $version - nothing to do."
            exit 0
          }
          $date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-dd")
          $nl = "`n"
          $entry =
            "  - Version: $version" + $nl +
            "    RequiredApiVersion: 6.0" + $nl +
            "    ReleaseDate: $date" + $nl +
            "    PackageUrl: https://github.com/cometmcisaac/hydra-playnite-sync/releases/download/v$version/HydraSync-$version.pext" + $nl +
            "    Changelog:" + $nl +
            "    - `"See https://github.com/cometmcisaac/hydra-playnite-sync/releases/tag/v$version for details.`"" + $nl
          $idx = $text.IndexOf("Packages:")
          if ($idx -lt 0) { throw "InstallerManifest.yaml has no Packages: section" }
          $nlIdx = $text.IndexOf($nl, $idx)
          if ($nlIdx -lt 0) { $text = $text + $nl + $entry }
          else { $text = $text.Substring(0, $nlIdx + 1) + $entry + $text.Substring($nlIdx + 1) }
          Set-Content -Path $file -Value $text -NoNewline
          git add $file
          if (git diff --cached --quiet) {
            Write-Host "No manifest changes."
            exit 0
          }
          git commit -m "ci: record release v$version in InstallerManifest"
          git push origin main
